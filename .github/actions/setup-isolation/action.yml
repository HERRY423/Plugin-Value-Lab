name: Prepare Ubuntu isolation prerequisites
description: Enable the distribution's scoped bubblewrap policy on an ephemeral hosted runner
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y bubblewrap python3-pip apparmor apparmor-profiles
        # Ubuntu's maintained profile grants namespace setup to bwrap and
        # restricts capabilities in children. Do not disable AppArmor/userns
        # protections globally or run PVL probes as root.
        # Noble ships this opt-in policy in apparmor-profiles, not apparmor.
        profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
        test -f "$profile"
        sudo apparmor_parser -r "$profile"
        dpkg-query -W bubblewrap apparmor apparmor-profiles
        bwrap --version
        # Existing real kernel and science gates remain mandatory.

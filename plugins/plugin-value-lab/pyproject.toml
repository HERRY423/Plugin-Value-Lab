[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-value-lab"
version = "0.6.0"
description = "Evidence-bounded paired plugin value evaluation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
dev = ["jsonschema>=4.22,<5"]
registry = ["cryptography>=41"]
science = ["anndata>=0.10,<0.13", "scipy>=1.11,<2"]
pseudobulk = ["anndata>=0.11,<0.14", "pydeseq2==0.5.4"]

[project.scripts]
plugin-value-lab = "value_lab.cli:main"

[tool.setuptools]
packages = ["value_lab"]

[tool.setuptools.package-data]
value_lab = ["static/*.html", "static/*.css", "static/*.js"]

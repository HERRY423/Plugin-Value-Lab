{
  "schema_version": "1.1",
  "name": "research-measurement-or-mechanism",
  "runs": 3,
  "execution": {
    "prompt": "虚构背景：产品改版后七日留存从 25% 变为 20%。同期新增付费渠道，埋点版本也升级。只有全站汇总，暂未提供渠道分组、事件定义或同观察窗口数据。团队要决定是否立即回滚。请找出有区分力的研究方向，并说明先补什么、为什么和何时停止某个解释。 这是离线教学题，只作分析。允许 Skill 和只读查看插件指导；不要联网、读取无关资料、写文件、运行命令或执行研究。",
    "max_turns": 6,
    "timeout_seconds": 120,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "contextual-research-reasoning",
      "type": "llm",
      "focus": "last_message",
      "weight": 1,
      "arm": "both",
      "criteria": "Pass only if it distinguishes product effect, composition/selection change and instrumentation/definition change; does not infer causal effect from two aggregate numbers; prioritizes obtaining comparable event definitions/windows and channel cohorts before an expensive experiment; states at least one discriminating observation and stop/revise signal, preserves missing data and avoids invented findings or numerical power claims. Do not require a plugin if native capabilities suffice."
    }
  ]
}

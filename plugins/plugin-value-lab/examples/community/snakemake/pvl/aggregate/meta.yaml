name: plugin-value-lab aggregate
description: Aggregate explicit donor-paired raw counts and verify the resulting SDK directory
url: https://github.com/HERRY423/Plugin-Value-Lab
authors: [HERRY423]
input:
  - counts: Raw-count h5ad
  - settings: Explicit biological configuration JSON
output:
  - Complete PVL result directory
notes: |
  Requires Python 3.11 or newer. This wrapper makes no model calls.
  Engine cache hits do not execute the wrapper and are not PVL verification.
